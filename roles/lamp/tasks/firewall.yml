---
- name: Instalar UFW
  apt:
    name: ufw
    state: present

- name: UFW - política padrão entrada negar
  ufw:
    policy: deny
    direction: incoming

- name: UFW - política padrão saída permitir
  ufw:
    policy: allow
    direction: outgoing

- name: UFW - limitar SSH (rate limiting)
  ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: UFW - permitir portas
  ufw:
    rule: allow
    port: "{{ item.split('/')[0] }}"
    proto: "{{ item.split('/')[1] }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Habilitar UFW
  ufw:
    state: enabled

