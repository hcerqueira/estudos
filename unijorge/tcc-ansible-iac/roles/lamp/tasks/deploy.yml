---
- name: Garantir existência do diretório web
  file:
    path: "{{ web_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy da página via template
  template:
    src: index.php.j2
    dest: "{{ web_root }}/index.php"
    owner: www-data
    group: www-data
    mode: "0644"
    backup: yes
  notify: Recarregar Apache

- name: Ajustar permissões do web root após deploy
  file:
    path: "{{ web_root }}"
    owner: www-data
    group: www-data
    mode: "0755"
    recurse: yes